# =====================================================
# Notification Service Configuration
# =====================================================
spring.application.name=ms-lending-app-notification-service
server.port=8084
spring.profiles.active=development

# R2DBC PostgreSQL
spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/lending_notification_db}
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres

# Flyway Database Migrations (runs over JDBC at startup, then R2DBC takes over)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# JDBC datasource (used exclusively by Flyway for migrations)
spring.flyway.url=${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5432/lending_notification_db}
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver


# Kafka Consumer
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service-group
#spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.auto-offset-reset=latest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.glo.lending.*
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.HashMap

# Kafka Topics
app.kafka.topic.loan-events=lendingLoanEvents
app.kafka.topic.customer-events=lendingCustomerEvents

# API Key Security
app.security.api-key=notification-service-api-key-2024

# Logging
logging.level.com.glo.lending.notification=DEBUG
logging.level.org.springframework.r2dbc=DEBUG
